# CI — เกตของโปรเจกต์ (PROCESS.md ตารางเกต) · เจ้าของ: ops-release
# repo นี้เป็นสาธารณะ: ไม่ใช้ pull_request_target · ไม่มี secret ในไฟล์นี้ · token อ่านอย่างเดียว
# ห้ามใส่ continue-on-error กับเกต — CI ต้องแดงเมื่อเกตแดง
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # ยกเลิกรอบเก่าของ PR เดียวกัน · push เข้า main ไม่ถูกยกเลิก
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ชื่อ job คือชื่อ check ที่ต้องตั้งให้บังคับบน main: "gates"
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ให้ตรงกับ engines.node ใน package.json และรุ่นที่ Vercel ใช้ (docs/OPERATIONS.md หัวข้อ S6)
          node-version: 26.x
          cache: npm

      - name: Install (ไม่รัน lifecycle script ของ dependency)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # รวมเทสต์ migration บนฐานข้อมูลว่าง (PGlite) · เทสต์ i18n · เทสต์ขอบเขตโมดูล · เทสต์ .env.example · เทสต์ release
      - name: Test
        run: npm test

      - name: Migration check
        run: npx drizzle-kit check

      # ไม่ตั้ง DATABASE_URL โดยตั้งใจ — build ต้องผ่านโดยไม่ต้องมีฐานข้อมูล
      - name: Build
        run: npm run build

  # เตรียมไว้ให้ qa-test: ไม่มีไฟล์เทสต์ = ข้ามติดตั้งเบราว์เซอร์และผ่าน · มีเทสต์แล้วล้ม = แดง
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      - name: Detect e2e tests
        id: detect
        run: |
          if compgen -G "tests/e2e/*.spec.ts" > /dev/null; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice::ยังไม่มีเทสต์ใน tests/e2e — ข้าม e2e"
          fi

      - name: Install Playwright browsers
        if: steps.detect.outputs.has_tests == 'true'
        run: npx playwright install --with-deps chromium webkit

      - name: E2E
        if: steps.detect.outputs.has_tests == 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure() && steps.detect.outputs.has_tests == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
