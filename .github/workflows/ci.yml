# CI — เกตของโปรเจกต์ (PROCESS.md ตารางเกต) · เจ้าของ: ops-release
# repo นี้เป็นสาธารณะ: ไม่ใช้ pull_request_target · ไม่มี secret ในไฟล์นี้ · token อ่านอย่างเดียว
# ห้ามใส่ continue-on-error กับเกต — CI ต้องแดงเมื่อเกตแดง
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # ยกเลิกรอบเก่าของ PR เดียวกัน · push เข้า main ไม่ถูกยกเลิก
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ชื่อ job คือชื่อ check ที่ต้องตั้งให้บังคับบน main: "gates"
  gates:
    name: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # ให้ตรงกับ engines.node ใน package.json และรุ่นที่ Vercel ใช้ (docs/OPERATIONS.md หัวข้อ S6)
          node-version: 26.x
          cache: npm

      - name: Install (ไม่รัน lifecycle script ของ dependency)
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # รวมเทสต์ migration บนฐานข้อมูลว่าง (PGlite) · เทสต์ i18n · เทสต์ขอบเขตโมดูล · เทสต์ .env.example · เทสต์ release
      - name: Test
        run: npm test

      - name: Migration check
        run: npx drizzle-kit check

      # ไม่ตั้ง DATABASE_URL โดยตั้งใจ — build ต้องผ่านโดยไม่ต้องมีฐานข้อมูล
      - name: Build
        run: npm run build

  # e2e: Playwright กับแอปที่ build จริง (webServer ใน playwright.config.ts build + start เอง) · 2 ขนาดจอ
  # ห้ามใส่ขั้น "ไม่มีเทสต์แล้วข้าม" — e2e เคยเขียวทั้งที่ไม่ได้ตรวจอะไร · ไม่มีเทสต์ = Playwright ล้ม = job แดง
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    # build (~1 นาที) + เทสต์ 170+ ข้อ × 2 โปรเจกต์ · เผื่อ runner ช้า
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.x
          cache: npm

      - name: Install
        run: npm ci --ignore-scripts

      # เฉพาะ Chromium (config ไม่ใช้ webkit/firefox)
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run test:e2e

      # เมื่อล้ม: report (html) และ trace/screenshot ใน test-results · ไม่มี secret ในไฟล์เหล่านี้ (ไม่มี env ลับใน job นี้)
      - name: Upload Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
